name: LONG scan

on:
  schedule:
    - cron: "10 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

jobs:
  trigger-long-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan all chunks (10 × ~3 coins)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -e
          RUN_ID="run_gh_$(date -u +%Y%m%d%H)"
          CHUNKS=10
          echo "Shared runId=$RUN_ID chunks=$CHUNKS"
          for C in $(seq 0 $((CHUNKS - 1))); do
            echo "=== chunk $C / $CHUNKS ==="
            response=$(curl -sS -o response.txt -w "%{http_code}" --max-time 30 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL%/}/api/long-scan?chunks=${CHUNKS}&chunk=${C}&fast=1&runId=${RUN_ID}")
            echo "HTTP $response"
            cat response.txt
            echo ""
            if [ "$response" -ge 400 ] || [ "$response" -eq 000 ]; then
              echo "Chunk $C failed"
              exit 1
            fi
            if grep -q '"logged"' response.txt; then
              echo "logged ok"
            else
              echo "WARNING: response missing logged field — is latest API deployed?"
            fi
          done
