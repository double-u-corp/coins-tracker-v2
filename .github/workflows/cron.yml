name: Trigger price cron

# Runs every 3 hours (8 runs per day). GitHub Actions schedules always run in UTC.
# Philippine Time (PHT, UTC+8) conversion:
# - 00:00 UTC -> 08:00 AM PHT (Daily Candle Reset)
# - 03:00 UTC -> 11:00 AM PHT
# - 06:00 UTC -> 02:00 PM PHT
# - 09:00 UTC -> 05:00 PM PHT (London Session Open)
# - 12:00 UTC -> 08:00 PM PHT (US Pre-Market)
# - 15:00 UTC -> 11:00 PM PHT (US Peak Volatility)
# - 18:00 UTC -> 02:00 AM PHT
# - 21:00 UTC -> 05:00 AM PHT
on:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  # Lets you trigger a run manually from the Actions tab, for testing.
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        run: |
          response=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron")
          echo "HTTP status: $response"
          cat response.txt
          if [ "$response" -ge 400 ]; then
            echo "Cron call failed"
            exit 1
          fi