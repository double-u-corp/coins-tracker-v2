name: Trigger price cron

# Runs every 3 hours starting at 00:00 UTC (8 runs per day)
# Optimized for global crypto trading session opens, daily resets, and volatility spikes.
on:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  # Lets you trigger a run manually from the Actions tab for testing.
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        run: |
          response=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron")
          echo "HTTP status: $response"
          cat response.txt
          if [ "$response" -ge 400 ]; then
            echo "Cron call failed"
            exit 1
          fi