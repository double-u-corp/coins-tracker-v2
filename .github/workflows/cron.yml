name: Trigger price cron

# Runs every 3 hours (8 runs per day) at minute 17 to bypass server congestion. GitHub Actions schedules always run in UTC.
# Philippine Time (PHT, UTC+8) conversion:
# - 00:17 UTC -> 08:17 AM PHT (Daily Candle Reset)
# - 03:17 UTC -> 11:17 AM PHT
# - 06:17 UTC -> 02:17 PM PHT
# - 09:17 UTC -> 05:17 PM PHT (London Session Open)
# - 12:17 UTC -> 08:17 PM PHT (US Pre-Market)
# - 15:17 UTC -> 11:17 PM PHT (US Peak Volatility)
# - 18:17 UTC -> 02:17 AM PHT
# - 21:17 UTC -> 05:17 AM PHT

on:
  schedule:
    - cron: "17 0,3,6,9,12,15,18,21 * * *"
  # Lets you trigger a run manually from the Actions tab, for testing.
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        run: |
          response=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron")
          echo "HTTP status: $response"
          cat response.txt
          if [ "$response" -ge 400 ]; then
            echo "Cron call failed"
            exit 1
          fi